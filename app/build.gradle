plugins { id 'com.android.application' }
android {
 namespace 'org.flightdesk.radar'
 compileSdk 35
 defaultConfig {
  applicationId 'org.flightdesk.radar'
  minSdk 29
  targetSdk 35
  versionCode 11
  versionName '1.0.0-beta.3'
  testInstrumentationRunner (project.hasProperty('adaptiveChecks') ? 'org.flightdesk.radar.AdaptiveChecks' : project.hasProperty('featureChecks') ? 'org.flightdesk.radar.FeatureChecks' : 'org.flightdesk.radar.DeviceChecks')
}
 def releaseStore = System.getenv('FLIGHTRADAR_KEYSTORE')
 def releaseStorePassword = System.getenv('FLIGHTRADAR_STORE_PASSWORD')
 def releaseKeyPassword = System.getenv('FLIGHTRADAR_KEY_PASSWORD')
 signingConfigs {
  release {
   if (releaseStore && releaseStorePassword && releaseKeyPassword) {
    storeFile file(releaseStore)
    storePassword releaseStorePassword
    keyAlias 'flight-radar'
    keyPassword releaseKeyPassword
   }
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.release
   debuggable false
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
